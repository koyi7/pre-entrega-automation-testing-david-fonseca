# Workflow opcional: ejecuta la suite en cada push (CI/CD con GitHub Actions)
name: Automatizacion QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar pruebas
        env:
          CI: "true"
        run: |
          mkdir -p reports/logs
          pytest tests/ -v --html=reports/reporte.html --self-contained-html

      - name: Subir artefactos (reporte, logs y capturas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-automatizacion
          path: |
            reports/
          if-no-files-found: ignore
